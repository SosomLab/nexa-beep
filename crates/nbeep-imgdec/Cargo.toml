[package]
name = "nbeep-imgdec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "이미지 격리 디코드 전용 프로세스 (권한 강등 · 본체와 분리 — R-5)"

[[bin]]
name = "nbeep-imgdec"
path = "src/main.rs"

[lints]
workspace = true

# ⚠️ 의도적으로 nbeep 크레이트 의존 0 — 신뢰 못 할 입력을 다루는 격리 프로세스라
# 본체 코드와 링크되지 않는다(파서 취약점이 본체를 못 건드림 — docs/01 §2 · FR-S-12).
# ★ 디코더 crate는 **여기에만** 둔다(M4-5) — 본체는 이미지 파서를 절대 링크하지 않는다.
# 의존 기록(docs/10 §3 원장): png(MIT/Apache-2.0) · jpeg-decoder(MIT/Apache-2.0).
[dependencies]
png = "0.17"
jpeg-decoder = "0.3"

# 권한 강등(M4-5ⓒ · R-5) — Linux seccomp-bpf의 아키텍처별 syscall 번호·prctl 상수.
# libc는 이미 링크되는 시스템 라이브러리의 바인딩이라 런타임 의존 0(DR-5) 불변.
# 라이선스 MIT/Apache-2.0(DR-12 ✅ · docs/10 §3 원장).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# 통합 테스트가 표본 PNG를 만들 때만 사용(배포물 아님).
png = "0.17"
