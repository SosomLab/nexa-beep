# nbeep-relay — 릴레이 클라이언트 어댑터(X-1·X-2b · docs/32 §12-6·§13). 와이어 v2 정의는
# nbeep-relay-proto(ADR-0016 · docs/56) — 서버(nexa-beepd)·클라·nexa-clip 사본이 같은 바이트를 쓴다.
# 방향은 relay → {proto, core, net, crypto} 단방향.
[package]
name = "nbeep-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nbeep-core.workspace = true
nbeep-net.workspace = true
nbeep-crypto.workspace = true
nbeep-relay-proto.workspace = true
sha2.workspace = true # RID 유도(snow가 이미 끄는 의존 — 트리 증가 0)

[dev-dependencies]
# 시험 전용 — InMemory 버스(`nbeep_net::inmem` = testkit 게이트) 위에 사다리 전송을 올려 본다(X-2 · 11-06).
nbeep-net = { workspace = true, features = ["testkit"] }
