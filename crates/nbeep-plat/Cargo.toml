[package]
name = "nbeep-plat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
memmap2 = "0.9"

# Linux 트레이(M3-2c · SNI) — zbus(MIT · 순수 Rust · 시스템 런타임 요구 없음).
# 원장: docs/10 §3. Linux 타깃 한정 — 다른 OS 산출물 크기 불변.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nbeep-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# keytap(G1 · H-26) — winit과 같은 판(0.5/0.2 계열)으로 중복 트리 방지.
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSEvent", "block2"] }
objc2-foundation = { version = "0.2", features = ["NSString"] }
block2 = "0.5"
