[package]
name = "nbeep-plat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
memmap2 = "0.9"
# 포트 구현의 계약 타입(scan.rs FileScanner 등 — M4 §6) · **전 타깃**.
# ⚠ 08-16까지 unix 한정이었고, mac 세션의 scan.rs(3-OS 공용)가 Windows 빌드를
# 깨뜨렸다(E0432 — "조건부 컴파일은 반대편을 의심한다"의 의존 선언판).
nbeep-core.workspace = true

# Linux 트레이(M3-2c · SNI) — zbus(MIT · 순수 Rust · 시스템 런타임 요구 없음).
# 원장: docs/10 §3. Linux 타깃 한정 — 다른 OS 산출물 크기 불변.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# Wayland 정식 활성화(08-29 · 트레이 "열기"가 창을 앞으로 못 가져오던 것) — GNOME
# appindicator 확장이 넘기는 xdg_activation 토큰으로 `activate(token, surface)`를
# 직접 부른다(winit에 외부 토큰 API 없음). **winit/sctk와 같은 판**(0.31/0.3/0.32 —
# Cargo.lock 동일 항목 · 의존 트리 중복 0 · 산출물 증가 0). client_system+dlopen은
# sctk가 이미 켠 기능(런타임 의존 0 유지 — libwayland는 dlopen).
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# Linux 클립보드 자체 구현(08-29 L-1 — 도구 스폰 폐지): X11 셀렉션은 x11rb 순수 Rust
# 연결(RustConnection · libxcb 불요) — winit과 같은 판 0.13(lock 동일 항목 · 트리 중복 0).
x11rb = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# keytap(G1 · H-26) + 메뉴바 상주(M3-2b · NSStatusItem) — winit과 같은
# 판(0.5/0.2 계열)으로 중복 트리 방지. 클래스별 feature는 트레이가 쓰는
# 상속 사슬(NSStatusBarButton→NSButton→NSControl→NSView)까지 전부 명시.
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = [
    "NSEvent",
    "block2",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSButton",
    "NSControl",
    "NSView",
    "NSResponder",
    "NSMenu",
    "NSMenuItem",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
    "NSCell",
    # 클립보드 자체 구현(08-30 L-1 mac — pbcopy/pbpaste/osascript 스폰 폐지).
    "NSPasteboard",
    # Dock 아이콘 제거(08-30 ui.tray_hide_taskbar — activation policy Accessory).
    "NSApplication",
    "NSRunningApplication",
] }
objc2-foundation = { version = "0.2", features = ["NSString", "NSGeometry", "NSThread", "NSBundle", "NSError", "NSDictionary", "NSObject", "NSData"] }
block2 = "0.5"
# 정식 macOS 알림(M3-8b · 08-15 사용자 확정 "정식 알림") — 번들(.app) 실행에서
# UNUserNotificationCenter + 클릭 delegate. keytap·트레이와 같은 objc2 0.5/0.2 판
# (중복 트리 방지). 비번들은 osascript 폴백 유지. MIT(원장 10 §3).
objc2-user-notifications = { version = "0.2", features = [
    "UNUserNotificationCenter",
    "UNNotificationRequest",
    "UNNotificationContent",
    "UNNotificationSound",
    "UNNotificationResponse",
    "UNNotification",
    "UNNotificationTrigger",
    "block2",
] }
