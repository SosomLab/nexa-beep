[package]
name = "nexa-beep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "제로 컨피그 로컬 네트워크 메신저 (본체)"

[[bin]]
name = "nexa-beep"
path = "src/main.rs"

[lints]
workspace = true

# 본체 = 조립 지점. 전 크레이트를 와이어링(어댑터 주입).
[dependencies]
nbeep-core.workspace = true
# ⚠️ testkit 임시 — 데모 창이 InMemory 전송을 쓴다(발견·세션·에코 실물 스택 시연).
# M1-4(실물 발견)에서 LocalDirect로 교체하며 feature 제거(docs/13 §11 원칙 복원).
nbeep-net = { workspace = true, features = ["testkit"] }
nbeep-crypto.workspace = true
nbeep-safe.workspace = true
nbeep-store.workspace = true
nexa-gfx.workspace = true # ★10-09 nexa-ui 이관(docs/50)
nexa-font.workspace = true # 시스템 글꼴 발견·폴백 체인(종전 nbeep-plat::font · 10-09)
nexa-sys = { workspace = true, features = ["gui"] } # OS 표시 언어 판정(10-09 P2) + ★10-10 `layer_present`(mac IOSurface 내보내기 · 외부 의존 0)
nbeep-license.workspace = true # 라이선스 앱 층(docs/50 P4 · Product nexa-beep · 게이트 기본 off)
nbeep-ui.workspace = true
nbeep-plat.workspace = true
nexa-conf.workspace = true # 설정 영속(M3-15 · ADR-0011 · ★10-09 nexa-ui 사본으로 전환)
nbeep-relay.workspace = true
getrandom = "0.2" # 페어링 암호 자동 추천(ADR-0015 · snow가 이미 끄는 의존 — 트리 증가 0) # 릴레이 서버 랑데부·사다리(X-2b/2c — 서버와 같은 와이어)
winit = "0.30"
softbuffer = "0.4"
