[package]
name = "nbeep-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# InMemoryTransport fake 노출(테스트 전용 · 릴리스 미포함). 상위 크레이트는 dev-dep에서 켠다.
testkit = []

[dependencies]
nbeep-core.workspace = true
socket2 = { version = "0.5", features = ["all"] }

# 인터페이스 열거(M1-9 · netif) — getifaddrs. 이미 링크되는 시스템 라이브러리의
# 바인딩이라 런타임 의존 0(DR-5) 불변 · MIT/Apache(DR-12 · 원장 docs/10 §3).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
