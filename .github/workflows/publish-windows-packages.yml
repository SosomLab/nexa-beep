# publish-windows-packages — winget · Chocolatey 제출(**Windows 채널 전용**)
#
# `release.yml`이 릴리스를 만든 뒤 호출하고, 손으로도 실행할 수 있다(재제출).
# macOS/Linux 배포는 여기에 없다 — Homebrew는 `homebrew.yml`, dmg/deb은 릴리스 자산
# 그 자체다. **이 파일의 스위치는 mac/Linux 배포에 아무 영향이 없다.**
#
# ## 게시 스위치 (nexa-memkeeper 방식 차용 — Windows 전용 프로젝트의 검증된 패턴)
#
# 채널마다 **저장소 변수 + 시크릿 둘 다** 있어야 실제로 나간다. 기본은 **꺼짐**이라
# 태그를 밀어도 winget/choco로는 아무것도 안 나간다(사용자 확정 08-11).
#
# | 채널 | 변수(Settings ▸ Variables) | 시크릿(Settings ▸ Secrets) |
# | --- | --- | --- |
# | winget | `WINGET_PUBLISH=true` | `WINGET_TOKEN`(winget-pkgs 포크 권한 PAT) |
# | Chocolatey | `CHOCO_PUSH=true` | `CHOCO_API_KEY` |
#
# 변수를 켜기 전까지는 **매니페스트만 만들어 아티팩트로 올린다** — 손으로 제출할 수
# 있게 해 두되, 성공한 척하지는 않는다. 준비되면 변수 하나만 켜면 되고 코드는 안 바뀐다.
# 둘 다 **중앙 저장소 검수**가 있어 되돌리기 어렵다는 점이 스위치를 두는 이유다.
name: publish-windows-packages

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그(예: v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # 스위치 상태를 먼저 보여 준다 — 시크릿은 API로 조회할 수 없어서, 제출이 조용히
  # 건너뛰어졌을 때 원인을 알 방법이 이 출력뿐이다. **값은 절대 찍지 않는다.**
  switches:
    runs-on: ubuntu-latest
    steps:
      - name: 게시 스위치 상태(값 노출 없음)
        env:
          HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
          HAS_CHOCO_KEY: ${{ secrets.CHOCO_API_KEY != '' }}
        run: |
          echo "태그                        : ${{ inputs.tag }}"
          echo "vars.WINGET_PUBLISH         : '${{ vars.WINGET_PUBLISH }}'  (true일 때만 winget PR)"
          echo "  └ secrets.WINGET_TOKEN 설정됨 : $HAS_WINGET_TOKEN"
          echo "vars.CHOCO_PUSH             : '${{ vars.CHOCO_PUSH }}'  (true일 때만 choco push)"
          echo "  └ secrets.CHOCO_API_KEY 설정됨 : $HAS_CHOCO_KEY"

  # ── Chocolatey(중앙 저장소 · 검수 있음) ──
  chocolatey:
    runs-on: windows-latest
    # ★ 게이트에 쓰는 시크릿은 **job 레벨**에 둔다 — 스텝 자신의 env는 그 스텝의
    #   `if:` 평가 시점에 있다고 장담할 수 없다. 여기 두면 모호함이 없다.
    env:
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: 릴리스 자산 내려받기
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "${{ inputs.tag }}" --dir assets --pattern 'nexa-beep-*'
      - name: 매니페스트 생성 + pack
        shell: bash
        env: { TAG: "${{ inputs.tag }}" }
        run: |
          set -euo pipefail
          v="${TAG#v}"
          ./packaging/render-manifests.sh "$v" assets out
          mkdir -p out/choco/nupkg
          for pkg in nexa-beep nexa-beep-portable; do
            choco pack "out/choco/$pkg/$pkg.nuspec" --version "$v" --outputdirectory out/choco/nupkg
          done
          ls -l out/choco/nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: chocolatey-${{ inputs.tag }}
          path: out/choco/**
      - name: choco push(CHOCO_PUSH + CHOCO_API_KEY 있을 때만)
        if: vars.CHOCO_PUSH == 'true' && env.CHOCO_API_KEY != ''
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          for pkg in nexa-beep nexa-beep-portable; do
            choco push "out/choco/nupkg/$pkg.$v.nupkg" \
              --source https://push.chocolatey.org/ --api-key "$CHOCO_API_KEY"
          done
          echo "제출 완료 — 커뮤니티 저장소는 **검수를 거쳐야** 노출된다(즉시 아님)."
      - name: 건너뛴 이유 안내
        if: vars.CHOCO_PUSH != 'true' || env.CHOCO_API_KEY == ''
        shell: bash
        run: |
          echo "::notice::choco push하지 않았다(CHOCO_PUSH='${{ vars.CHOCO_PUSH }}')."
          echo "아티팩트 chocolatey-${{ inputs.tag }}의 nupkg를 받아 직접 push할 수 있다."

  # ── winget(중앙 저장소 · PR + 자동 검증) ──
  winget:
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 릴리스 자산 내려받기
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "${{ inputs.tag }}" --dir assets --pattern 'nexa-beep-*'
      - name: 매니페스트 생성 + 검증
        shell: bash
        env: { TAG: "${{ inputs.tag }}" }
        run: |
          set -euo pipefail
          ./packaging/render-manifests.sh "${TAG#v}" assets out
          # winget 자체 검증기로 먼저 본다 — 형식 오류를 PR 리뷰어가 아니라 여기서 잡는다.
          for d in $(find out/winget -mindepth 5 -maxdepth 5 -type d); do
            echo "== $d"; winget validate --manifest "$d" || exit 1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: winget-${{ inputs.tag }}
          path: out/winget/**
      - name: winget-pkgs PR(WINGET_PUBLISH + WINGET_TOKEN 있을 때만)
        if: vars.WINGET_PUBLISH == 'true' && env.WINGET_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          curl.exe -L -o wingetcreate.exe https://aka.ms/wingetcreate/latest
          # 우리가 만든 매니페스트를 그대로 제출한다(update가 아니라 submit) —
          # 첫 등록과 갱신을 같은 경로로 처리하고, 손으로 쓴 ko-KR 로캘도 보존된다.
          for d in $(find out/winget -mindepth 5 -maxdepth 5 -type d); do
            ./wingetcreate.exe submit --token "$WINGET_TOKEN" "$d"
          done
          echo "PR 생성 — microsoft/winget-pkgs의 자동 검증·리뷰를 거쳐야 노출된다."
      - name: 건너뛴 이유 안내
        if: vars.WINGET_PUBLISH != 'true' || env.WINGET_TOKEN == ''
        shell: bash
        run: |
          echo "::notice::winget PR을 만들지 않았다(WINGET_PUBLISH='${{ vars.WINGET_PUBLISH }}')."
          echo "아티팩트 winget-${{ inputs.tag }}를 microsoft/winget-pkgs에 직접 PR할 수 있다."
