# CI — 4타깃 build/test/lint + 예산 게이트 (docs/18 SSOT · M0-3)
# 스택 = ADR-0001(Rust). rust-toolchain.toml이 stable·컴포넌트·타깃을 고정한다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# main은 항상 green(docs/15) — 아래 잡이 하나라도 실패하면 병합 금지.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings          # 워크스페이스 경고 = 실패
  RUSTDOCFLAGS: -D warnings       # rustdoc 링크 깨짐 = 실패

jobs:
  # ── 린트: fmt + clippy (한 곳에서) ──────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (전체 · testkit)
        run: cargo clippy --workspace --all-targets --features nbeep-core/testkit
      - name: rustdoc (링크 검증)
        run: cargo doc --workspace --no-deps --features nbeep-core/testkit

  # ── 테스트: 네이티브 3-OS(중립 크레이트 4타깃 검증의 실행부) ──
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest    # x86_64-unknown-linux-gnu
          - os: macos-latest     # aarch64-apple-darwin (네이티브)
          - os: windows-latest   # x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace
      - name: test
        run: cargo test --workspace --features nbeep-core/testkit

  # ── 크로스 빌드: 실행할 수 없는 타깃은 컴파일 검증 + 릴리스 크기 리포트 ──
  cross-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: aarch64-pc-windows-msvc   # Win ARM(실행 불가 → build만)
            bin: nexa-beep.exe
          - os: macos-latest
            target: x86_64-apple-darwin       # Intel mac(러너가 arm64 → build만)
            bin: nexa-beep
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: build (${{ matrix.target }})
        run: cargo build --workspace --target ${{ matrix.target }}
      - name: release size (${{ matrix.target }}, ≤10MB)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p nexa-beep --target ${{ matrix.target }}
          path="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          size=$(wc -c < "$path")
          printf '%s: %d bytes (%.2f MB)\n' "${{ matrix.target }}" "$size" "$(awk "BEGIN{print $size/1048576}")"
          [ "$size" -le $((10*1024*1024)) ] || { echo "::error::${{ matrix.target }} > 10MB(NFR-B-3)"; exit 1; }

  # ── 예산 게이트: 산출물 크기 (NFR-B-3 ≤ 10MB) ────────────────
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: release build
        run: cargo build --release -p nexa-beep -p nbeep-imgdec
      - name: size gate (linux, ≤10MB/바이너리)
        shell: bash
        run: |
          set -euo pipefail
          limit=$((10 * 1024 * 1024))
          fail=0
          for bin in nexa-beep nbeep-imgdec; do
            path="target/release/$bin"
            size=$(wc -c < "$path")
            printf '%-16s %8d bytes (%.2f MB)\n' "$bin" "$size" "$(awk "BEGIN{print $size/1048576}")"
            if [ "$size" -gt "$limit" ]; then
              echo "::error::$bin 크기 $size > 10MB(NFR-B-3) — 병합 금지"
              fail=1
            fi
          done
          exit $fail
      # 4타깃 크기: linux=이 잡, mac/win(ARM·Intel)=cross-build 잡. Win x64=test 잡 빌드.
      # TODO(SP-1 실기·M1+): 임포트 화이트리스트(NFR-B-5) · 유휴 RSS(macOS=phys_footprint) ·
      #   24h 누수(NFR-B-6) 게이트 — 실물 창·상주 루프 도착 후 추가.
