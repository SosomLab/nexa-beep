# Nexa Beep — 제로 컨피그 로컬 네트워크 메신저 (올 러스트 워크스페이스)
# 아키텍처 = docs/01, 스택 = ADR-0001(docs/07). 크레이트 경계는 단방향(역참조 금지).
# 외부 crate 기본 0 지향(DR-8·NFR-O-4) — 추가는 docs/10 §3 원장에 건별 기록.
[workspace]
resolver = "2"
members = [
  "crates/nbeep-core",    # 도메인 + 포트(허브 — nbeep 의존 0)
  "crates/nbeep-net",     # 전송·발견 (Transport 어댑터)
  "crates/nbeep-crypto",  # Noise 세션·TOFU
  "crates/nbeep-safe",    # 수신 무해화(.beepq)
  "crates/nbeep-store",   # 영속·암호화 기록
  "crates/nbeep-ui",      # 앱 화면(위젯 — nexa-ctl 위에 · ★10-09 nexa-ui 이관 — docs/50)
  "crates/nbeep-plat",    # 플랫폼 경계(창·입력·IME·격리표식)
  "crates/nbeep-imgdec",  # (bin) 이미지 격리 디코드 — 별도 프로세스
  "crates/nbeep-relay",   # 릴레이 와이어·클라이언트 어댑터(서버와 공유 — Q-32-13)
  "crates/nexa-beep",     # (bin) 진입·조립·생명주기
  "crates/nexa-beepd",    # (bin) 릴레이 서버 — 별도 실행 파일·별도 배포(W-1~W-4)
  "tools/mkavatars",      # (bin) 개발 도구 — 원본 PNG → 내장 아바타 자산. **배포물 아님**
  "crates/nbeep-license", # 라이선스 앱 층(nexa-license 위 · Feature 0 · docs/50 P4)
]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.82"          # MSRV 잠정(ADR-0001 §8) — M0 진행 중 확정
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
authors = ["Sangyong Bae <kiros33@gmail.com>"]
repository = "https://github.com/SosomLab/nexa-beep"
homepage = "https://sosomlab.com"

# 워크스페이스 공통 린트 — 각 크레이트가 [lints] workspace = true로 상속.
[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
redundant_clone = "warn"
inefficient_to_string = "warn"
# 프로덕션 경로 unwrap/expect 금지(docs/13 §9) — 테스트는 각 크레이트에서 허용.
unwrap_used = "warn"

[workspace.dependencies]
nbeep-core = { path = "crates/nbeep-core" }
nbeep-net = { path = "crates/nbeep-net" }
nbeep-crypto = { path = "crates/nbeep-crypto" }
nbeep-safe = { path = "crates/nbeep-safe" }
nbeep-store = { path = "crates/nbeep-store" }
nbeep-ui = { path = "crates/nbeep-ui" }
nbeep-plat = { path = "crates/nbeep-plat" }
# ★ nexa-ui(계열 공용 UI 라이브러리 · 10-09 docs/50 P1-c) — **형제 저장소 path 의존**(nexa-sql·nexa-dir3와 같은 방식).
#   clone 시 `../nexa-ui`를 나란히 둔다(docs/18 §1) · CI는 SosomLab/nexa-ui를 형제 경로로 체크아웃한다.
#   계보: nexa-gfx ← nbeep-gfx · nexa-ctl ← nbeep-ctl · nexa-conf = beep 사본과 동일 본문(최신본은 ui에 올린다).
nexa-gfx = { path = "../nexa-ui/crates/nexa-gfx" }
nexa-ctl = { path = "../nexa-ui/crates/nexa-ctl" }
nexa-conf = { path = "../nexa-ui/crates/nexa-conf" }
nexa-font = { path = "../nexa-ui/crates/nexa-font" }
nexa-dlg = { path = "../nexa-ui/crates/nexa-dlg" } # 파일 선택 대화상자(3-OS 자체 · 10-09 docs/50 P3 · ADR-0014 정정)
nexa-sys = { path = "../nexa-ui/crates/nexa-sys", default-features = false } # OS 신호(locale — `ui.language=system` · 10-09 P2)
# ★ nexa-license(계열 공용 라이선스 라이브러리 · 10-09 docs/50 P4) — 형제 저장소 path 의존(`../nexa-license`).
nexa-license = { path = "../nexa-license/crates/nexa-license" }
nbeep-license = { path = "crates/nbeep-license" }
nbeep-relay = { path = "crates/nbeep-relay" }
sha2 = "0.10" # SHA-256(FR-X-6) — snow가 이미 끄는 의존(트리 증가 0)

# 릴리스 = 예산 게이트(단일 실행 파일 ≤10MB — docs/05 NFR-B-3, docs/18).
[profile.release]
opt-level = "z"        # 크기 우선(SP-1에서 z vs 3 실측 비교 예정)
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
